name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # PostgreSQL ya viene en el runner, pero sus binarios no están en el PATH.
      - run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # Incluye lint, tipos, pruebas, build, migraciones, deriva del esquema y pruebas de integración.
      - run: pnpm test:db
